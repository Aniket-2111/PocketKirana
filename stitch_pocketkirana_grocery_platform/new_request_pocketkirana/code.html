<script>
        // Simple timer logic for visual effect
        let timeLeft = 25;
        const timerText = document.getElementById('timerText');
        const timerPath = document.getElementById('timerPath');
        const totalDuration = 30; // Assuming it started at 30s

        const interval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(interval);
                return;
            }
            timeLeft--;
            
            // Format time
            const seconds = timeLeft.toString().padStart(2, '0');
            timerText.innerText = `0:${seconds}`;
            
            // Calculate progress (0 to 100)
            // Stroke dashoffset goes from 0 (full) to 100 (empty)
            const percentage = ((totalDuration - timeLeft) / totalDuration) * 100;
            timerPath.style.strokeDashoffset = percentage;
            
            // Change color if running low
            if(timeLeft <= 10) {
                 timerPath.classList.remove('text-primary');
                 timerPath.classList.add('text-error');
                 timerText.classList.remove('text-primary');
                 timerText.classList.add('text-error');
                 timerText.classList.add('animate-pulse');
            }

        }, 1000);
    </script>
