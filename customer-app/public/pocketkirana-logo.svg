<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">PocketKirana</title>
  <desc id="desc">PocketKirana grocery brand logo with tagline</desc>

  <defs>
    <linearGradient id="pocketGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075B45"/>
      <stop offset="100%" stop-color="#003F31"/>
    </linearGradient>
    <linearGradient id="kiranaGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72D20B"/>
      <stop offset="100%" stop-color="#36A800"/>
    </linearGradient>
  </defs>

  <!-- Brand wordmark -->
  <text x="800" y="205"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="170"
        font-weight="800"
        letter-spacing="-8">
    <tspan fill="url(#pocketGreen)">Pocket</tspan><tspan fill="url(#kiranaGreen)">Kirana</tspan>
  </text>

  <!-- Tagline -->
  <text x="800" y="290"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="500"
        letter-spacing="3"
        fill="#075B45">Ghar Ki Har Zarurat, Ab Aur Bhi Aasaan</text>

  <!-- Orange swoosh -->
  <path d="M470 345 Q800 295 1130 345"
        fill="none"
        stroke="#F39C12"
        stroke-width="12"
        stroke-linecap="round"/>
</svg>
